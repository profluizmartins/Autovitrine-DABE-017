services:
  db:
    image: postgres:16-alpine
    container_name: autovitrine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autovitrine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autovitrine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: autovitrine_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PROVIDER: json # postgres
      DATABASE_URL: postgresql://postgres:secret_password@db:5432/autovitrine_db?schema=public
      JWT_SECRET: segredo_jwt_autovitrine_2026
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autovitrine_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auto.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data: